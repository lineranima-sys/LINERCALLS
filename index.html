<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinerCall's - Oficial</title>
    <style>
        :root {
            --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-card: #1e1f22;
            --text-main: #dbdee1; --text-muted: #949ba4; --cyan: #00cbc6; --white: #ffffff;
        }
        .light-mode {
            --bg-main: #f2f3f5; --bg-sidebar: #e3e5e8; --bg-card: #ffffff;
            --text-main: #313338; --text-muted: #4e5058; --cyan: #00cbc6; --white: #000000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        #lock-screen { position: fixed; inset: 0; background: #111214; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .lock-box { background: #2b2d31; padding: 30px; border-radius: 8px; text-align: center; border: 2px solid var(--cyan); width: 90%; max-width: 350px; color: white; }
        
        .sidebar { width: 240px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; padding: 10px; border-right: 1px solid rgba(0,0,0,0.2); }
        .brand { font-size: 20px; font-weight: bold; color: var(--cyan); text-align: center; padding-bottom: 15px; border-bottom: 2px solid var(--cyan); text-transform: uppercase; }
        .section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin: 15px 0 5px; font-weight: bold; }
        .btn { background: none; border: none; color: var(--text-main); text-align: left; padding: 10px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .btn:hover, .btn.active { background: var(--cyan); color: white; }

        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
        .view-panel { flex: 1; display: none; padding: 20px; flex-direction: column; overflow-y: auto; }
        .active-panel { display: flex; }

        .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); height: 100%; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: var(--cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-transform: uppercase; }
        
        input { background: #1e1f22; border: 1px solid #3f4147; color: white; padding: 10px; border-radius: 4px; margin: 8px 0; width: 100%; text-align: center; }
        .card-box { background: var(--bg-card); padding: 20px; border-radius: 8px; width: 100%; max-width: 450px; margin: auto; text-align: center; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
        .status-card { background: var(--bg-main); padding: 10px; border-radius: 4px; display: flex; flex-direction: column; border-left: 3px solid var(--cyan); }
        .log { background: #111214; padding: 10px; height: 100px; overflow-y: auto; text-align: left; font-size: 12px; margin: 10px 0; border-radius: 4px; color: #2ecc71; }
        
        .ranking-table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; background: var(--bg-card); border-radius: 6px; overflow: hidden; }
        .ranking-table th, .ranking-table td { padding: 12px; border-bottom: 1px solid var(--bg-main); }
        .ranking-table th { background: var(--cyan); color: white; }
        .theme-btn { background: var(--cyan); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
    <script src="https://jit.si"></script>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h2>LinerCall's 🔐</h2>
            <input type="password" id="pass-input" placeholder="Senha do servidor (2020)">
            <button onclick="checkPassword()" style="background:var(--cyan); color:white; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer;">Entrar</button>
        </div>
    </div>

    <audio id="bg-music" loop src="https://soundhelix.com"></audio>

    <div class="sidebar">
        <div class="brand">LinerCall's</div>
        <div class="section-title">Menu</div>
        <button class="btn active" id="nav-chat" onclick="switchTab('chat')">💬 Falar com Amizades</button>
        <button class="btn" id="nav-jogar" onclick="switchTab('jogar')">🎮 Jogar Mini História</button>
        <button class="btn" id="nav-ranking" onclick="switchTab('ranking')">🏆 Ranking do Jogo</button>
        <button class="btn" id="nav-config" onclick="switchTab('config')">⚙️ Configurações</button>
        
        <div style="margin-top:auto; font-size:12px; background:var(--bg-card); padding:10px; border-radius:6px;">
            🎵 Música: <button onclick="toggleMusic()" id="music-btn" style="background:#2ecc71; border:none; color:white; padding:2px 6px; border-radius:3px; cursor:pointer;">Ligar</button>
        </div>
    </div>

    <div class="main-content">
        <div id="panel-chat" class="view-panel active-panel" style="padding:0; height:100%;">
            <div style="padding:15px; display:flex; gap:10px; background: rgba(0,0,0,0.1);">
                <button class="theme-btn" style="margin:0;" onclick="startVoiceCall()">🔊 Entrar na Call</button>
                <button class="theme-btn" style="margin:0; background:#e74c3c;" onclick="endVoiceCall()">❌ Sair da Call</button>
            </div>
            <div id="voice-box" style="height:180px; display:none; background:#111214;"></div>
            <div class="chat-container">
                <div class="chat-messages" id="chat-flow">
                    <div class="message">
                        <div class="avatar">LC</div>
                        <div>
                            <strong>Aviso do Sistema</strong>
                            <div class="msg-text">Bem-vindo! Digite no chat abaixo para conversar.</div>
                        </div>
                    </div>
                </div>
                <div style="padding:20px;"><input type="text" id="chat-input" placeholder="Conversar com a galera..." style="text-align:left; padding-left:15px;" onkeypress="handleChatKey(event)"></div>
            </div>
        </div>

        <div id="panel-jogar" class="view-panel">
            <div class="card-box">
                <h2 id="game-char-name">Carregando...</h2>
                <div class="status-grid">
                    <div class="status-card"><span>Vitórias</span><b id="p-wins" style="color:#2ecc71;">0</b></div>
                    <div class="status-card"><span>Derrotas</span><b id="p-losses" style="color:#e74c3c;">0</b></div>
                </div>
                <div class="log" id="game-log">>> Pronto para a batalha?</div>
                <button onclick="executeBattle()" style="background:var(--cyan); color:white; border:none; padding:12px; border-radius:4px; font-weight:bold; cursor:pointer; width:100%;">⚔️ Avançar na História</button>
            </div>
        </div>

        <div id="panel-ranking" class="view-panel">
            <h2>🏆 Líderes do Jogo</h2>
            <table class="ranking-table">
                <thead><tr><th>Posição</th><th>Nome no Jogo</th><th>Vitórias</th><th>Derrotas</th></tr></thead>
                <tbody id="ranking-table-body"></tbody>
            </table>
        </div>

        <div id="panel-config" class="view-panel">
            <div class="card-box">
                <h2>⚙️ Configurações</h2>
                <div style="margin-top:15px; text-align:left;">
                    <label>Nome no CHAT:</label><input type="text" id="config-profile-name" style="text-align:left;">
                    <label>Nome no JOGO:</label><input type="text" id="config-game-name" style="text-align:left;">
                    <button onclick="saveProfileChanges()" style="background:#248046; color:white; border:none; padding:10px; width:100%; border-radius:4px; font-weight:bold; cursor:pointer; margin-bottom:15px;">Salvar Nomes</button>
                    <button class="theme-btn" style="width:100%;" onclick="toggleTheme()">🌗 Alternar Modo Claro / Escuro</button>
                    <button onclick="logoutAccount()" style="background:#da373c; color:white; border:none; padding:8px; width:100%; border-radius:4px; cursor:pointer; margin-top:20px; font-size:12px;">Trocar de Conta (E-mail)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = "", jitsiAPI = null;

        function checkPassword() {
            if(document.getElementById('pass-input').value === "2020") {
                document.getElementById('lock-screen').style.display = 'none';
                promptGameAuth();
            } else { alert("Senha incorreta!"); }
        }

        function promptGameAuth() {
            if (!currentEmail) {
                let email = prompt("Digite seu E-mail:");
                currentEmail = email ? email : "anonimo@liner.com";
                
                let localData = localStorage.getItem(currentEmail);
                if (!localData) {
                    let nickChat = prompt("Nome no CHAT:");
                    let nickJogo = prompt("Nome no JOGO:");
                    localStorage.setItem(currentEmail, JSON.stringify({ 
                        profileName: nickChat || "Membro", gameName: nickJogo || "Viajante", wins: 0, losses: 0 
                    }));
                  let idx = JSON.parse(localStorage.getItem('liner_idx')) || [];
if(!idx.includes(currentEmail)) { idx.push(currentEmail); localStorage.setItem('liner_idx', JSON.stringify(idx)); }
}
}
updateAllData();
}
function switchTab(t) {
document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active-panel'));
document.querySelectorAll('.sidebar .btn').forEach(b => b.classList.remove('active'));
document.getElementById('panel-' + t).classList.add('active-panel');
document.getElementById('nav-' + t).classList.add('active');
updateAllData();
}
function updateAllData() {
let d = JSON.parse(localStorage.getItem(currentEmail));
if(!d || !d.profileName) {
d = { profileName: "Membro", gameName: "Viajante", wins: 0, losses: 0 };
localStorage.setItem(currentEmail, JSON.stringify(d));
}
document.getElementById('game-char-name').innerText = "🎭 " + d.gameName;
document.getElementById('p-wins').innerText = d.wins;
document.getElementById('p-losses').innerText = d.losses;
document.getElementById('config-profile-name').value = d.profileName;
document.getElementById('config-game-name').value = d.gameName;
const idx = JSON.parse(localStorage.getItem('liner_idx')) || [];
let jog = []; idx.forEach(e => { const data = JSON.parse(localStorage.getItem(e)); if(data) jog.push(data); });
jog.sort((a,b) => b.wins - a.wins);
