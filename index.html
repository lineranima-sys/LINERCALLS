<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinerCall's - Interface Gamer Premium</title>
    <style>
        :root {
            --bg-darkest: #0a0c10;
            --bg-panel: #131722;
            --bg-card: #1c2333;
            --cyan-glow: #00f2fe;
            --cyan-dark: #0097a7;
            --text-white: #ffffff;
            --text-muted: #707e94;
            --red-alert: #ff4d4d;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background-color: var(--bg-darkest); 
            color: var(--text-white); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* Tela de Autenticação */
        #lock-screen { 
            position: fixed; 
            inset: 0; 
            background: rgba(10, 12, 16, 0.95); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
            backdrop-filter: blur(10px);
        }
        .lock-box { 
            background: var(--bg-panel); 
            padding: 40px; 
            border-radius: 12px; 
            text-align: center; 
            border: 2px solid var(--cyan-glow); 
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
            width: 90%; 
            max-width: 380px; 
        }
        .lock-box h2 {
            font-size: 26px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: var(--cyan-glow);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* Inputs e Botões Globais */
        input[type="text"], input[type="password"] { 
            background: var(--bg-darkest); 
            border: 1px solid var(--bg-card); 
            color: var(--text-white); 
            padding: 12px; 
            border-radius: 6px; 
            margin: 12px 0; 
            width: 100%; 
            transition: 0.3s;
            outline: none;
        }
        input:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }
        .primary-btn { 
            background: linear-gradient(135deg, var(--cyan-glow), var(--cyan-dark)); 
            color: #0a0c10; 
            border: none; 
            padding: 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .primary-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        /* Menu Lateral Estilizado */
        .sidebar { 
            width: 260px; 
            background-color: var(--bg-panel); 
            display: flex; 
            flex-direction: column; 
            padding: 20px 15px; 
            border-right: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .brand { 
            font-size: 22px; 
            font-weight: 800; 
            color: var(--cyan-glow); 
            text-align: center; 
            padding-bottom: 20px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
        }
        .section-title { 
            font-size: 11px; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            margin: 25px 0 10px; 
            font-weight: 700; 
            letter-spacing: 1px;
        }
        .nav-btn { 
            background: none; 
            border: none; 
            color: var(--text-muted); 
            text-align: left; 
            padding: 12px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 14px; 
            font-weight: 600;
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: 0.2s;
        }
        .nav-btn:hover {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.03);
        }
        .nav-btn.active { 
            background: rgba(0, 242, 254, 0.1); 
            color: var(--cyan-glow); 
            border-left: 4px solid var(--cyan-glow);
            border-radius: 0 8px 8px 0;
            padding-left: 11px;
        }

        /* Container Principal de Conteúdo */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg-darkest); 
        }
        .view-panel { 
            flex: 1; 
            display: none; 
            padding: 30px; 
            flex-direction: column; 
            overflow-y: auto; 
        }
        .view-panel.active-panel { 
            display: flex; 
        }

        /* Layout Especial da Aba de Comunicação */
        .communication-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .voice-bar { 
            padding: 15px 25px; 
            display: flex; 
            gap: 15px; 
            background: var(--bg-panel); 
            border-radius: 10px;
            margin-bottom: 20px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .voice-btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .voice-btn.join { background: var(--cyan-glow); color: #000; }
        .voice-btn.leave { background: var(--red-alert); color: #fff; display: none; }
        .voice-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Área do Chat */
        .chat-wrapper { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg-panel); 
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
        }
        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .message-row { 
            display: flex; 
            gap: 15px; 
            align-items: flex-start;
        }
        .user-avatar { 
            width: 42px; 
            height: 42px; 
            background: linear-gradient(135deg, var(--cyan-glow), var(--cyan-dark)); 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #0a0c10; 
            font-weight: bold; 
            font-size: 16px;
        }
        .message-body { display: flex; flex-direction: column; }
        .message-author { font-weight: bold; color: var(--text-white); font-size: 14px; margin-bottom: 4px;}
        .message-text { color: #b9bbbe; font-size: 14px; line-height: 1.5; }
        
        .chat-input-bar { 
            padding: 20px; 
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
        }
        .chat-input-bar input { margin: 0; text-align: left; padding-left: 15px; flex: 1; }
        .send-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--cyan-glow);
            padding: 0 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .send-btn:hover { background: var(--cyan-glow); color: #000; }

        /* Estilo dos Módulos das outras abas (Jogo, Configurações) */
        .panel-title { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
        .panel-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        
        .dashboard-box { 
            background: var(--bg-panel); 
            padding: 30px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 500px; 
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .stat-item { background: var(--bg-card); padding: 15px; border-radius: 8px; text-align: center; border-bottom: 2px solid var(--cyan-glow); }
        .stat-item span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; }
        .stat-item b { display: block; font-size: 20px; color: var(--text-white); margin-top: 5px; }
        
        .console-log { 
            background: var(--bg-darkest); 
            padding: 15px; 
            height: 120px; 
            overflow-y: auto; 
            text-align: left; 
            font-size: 13px; 
            margin: 15px 0; 
            border-radius: 6px; 
            color: #2ecc71; 
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ranking-grid {
            width: 100%;
            background: var(--bg-panel);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .ranking-row {
            display: grid;
            grid-template-columns: 80px 1fr 100px 100px;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .ranking-header {
            background: rgba(0, 242, 254, 0.05);
            font-weight: bold;
            color: var(--cyan-glow);
        }

/* Configurações */
.config-group { margin-bottom: 20px; text-align: left; }
.config-group label { display: block; font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }

let currentEmail = "";
let jitsiAPI = null;
// Gerenciamento de Cliques e Eventos Principais
document.getElementById('login-trigger').addEventListener('click', processAuth);
document.getElementById('tab-chat-btn').addEventListener('click', () => changeView('chat'));
document.getElementById('tab-jogar-btn').addEventListener('click', () => changeView('jogar'));
document.getElementById('tab-ranking-btn').addEventListener('click', () => changeView('ranking'));
document.getElementById('tab-config-btn').addEventListener('click', () => changeView('config'));
document.getElementById('music-trigger').addEventListener('click', handleMusicToggle);
document.getElementById('call-join-trigger').addEventListener('click', connectVoiceCall);
document.getElementById('call-leave-trigger').addEventListener('click', disconnectVoiceCall);
document.getElementById('chat-send-trigger').addEventListener('click', sendTextMessage);
document.getElementById('battle-trigger').addEventListener('click', playBattleTurn);
document.getElementById('save-settings-trigger').addEventListener('click', persistProfileData);
document.getElementById('theme-trigger').addEventListener('click', toggleInterfaceTheme);
document.getElementById('logout-trigger').addEventListener('click', clearUserSession);
document.getElementById('chat-input').addEventListener('keypress', function(e) {
if (e.key === 'Enter') sendTextMessage();
});
function processAuth() {
if(document.getElementById('pass-input').value === "2020") {
document.getElementById('lock-screen').style.display = 'none';
initializeSession();
} else {
alert("Senha do servidor incorreta.");
}
}
function initializeSession() {
if (!currentEmail) {
let email = prompt("Informe seu e-mail de acesso para carregar os registros locais:");
currentEmail = email ? email.trim() : "visitante@linercalls.com";
let localDataset = localStorage.getItem(currentEmail);
if (!localDataset) {
let nickChat = prompt("Escolha o seu apelido de exibição no Chat:");
let nickJogo = prompt("Defina o nome do seu personagem no minijogo:");
localStorage.setItem(currentEmail, JSON.stringify({
profileName: nickChat || "Usuário",
gameName: nickJogo || "Guerreiro",
wins: 0,
losses: 0
}));
let directory = JSON.parse(localStorage.getItem('liner_idx')) || [];
if(!directory.includes(currentEmail)) {
directory.push(currentEmail);
localStorage.setItem('liner_idx', JSON.stringify(directory));
}
}
}
refreshInterfaceData();
}
function changeView(targetPanel) {
document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active-panel'));
document.querySelectorAll('.sidebar .nav-btn').forEach(btn => btn.classList.remove('active'));
document.getElementById('panel-' + targetPanel).classList.add('active-panel');
document.getElementById('tab-' + targetPanel + '-btn').classList.add('active');
refreshInterfaceData();
}
function refreshInterfaceData() {
let record = JSON.parse(localStorage.getItem(currentEmail));
if(!record) return;
document.getElementById('game-char-name').innerText = "⚔️ " + (record.gameName || "Viajante");
document.getElementById('p-wins').innerText = record.wins || 0;
document.getElementById('p-losses').innerText = record.losses || 0;
document.getElementById('config-profile-name').value = record.profileName || "";
document.getElementById('config-game-name').value = record.gameName || "";
const directory = JSON.parse(localStorage.getItem('liner_idx')) || [];
let leaderboard = [];
directory.forEach(email => {
const data = JSON.parse(localStorage.getItem(email));
if(data) leaderboard.push(data);
});
leaderboard.sort((alpha, beta) => (beta.wins || 0) - (alpha.wins || 0));
const container = document.getElementById('ranking-rows-container');
container.innerHTML = "";
leaderboard.forEach((player, index) => {
container.innerHTML +=  <div class="ranking-row"> <div>${index + 1}º</div> <div><b>${player.gameName || 'Desconhecido'}</b></div> <div style="color:#2ecc71;">🟩 ${player.wins || 0}</div> <div style="color:#e74c3c;">🟥 ${player.losses || 0}</div> </div>;
});
}
function sendTextMessage() {
const inputField = document.getElementById('chat-input');
const messageText = inputField.value.trim();
if(!messageText) return;
const record = JSON.parse(localStorage.getItem(currentEmail)) || { profileName: "Membro" };
const timeline = document.getElementById('chat-flow');
timeline.innerHTML +=  <div class="message-row"> <div class="user-avatar">${record.profileName.substring(0,2).toUpperCase()}</div> <div class="message-body"> <span class="message-author">${record.profileName}</span> <div class="message-text">${messageText}</div> </div> </div>;
inputField.value = "";
timeline.scrollTop = timeline.scrollHeight;
}
function connectVoiceCall() {
const containerBox = document.getElementById('voice-box');
containerBox.style.display = 'block';
containerBox.innerHTML = "";
document.getElementById('call-join-trigger').style.display = 'none';
document.getElementById('call-leave-trigger').style.display = 'block';
jitsiAPI = new JitsiMeetExternalAPI("meet.jit.si", {
roomName: "Liner_Geral_Call_Room_Secure",
width: "100%",
height: "100%",
parentNode: containerBox,
configOverwrite: { startWithAudioMuted: false, prejoinPageEnabled: false }
});
}
function disconnectVoiceCall() {
document.getElementById('voice-box').style.display = 'none';
document.getElementById('call-join-trigger').style.display = 'block';
document.getElementById('call-leave-trigger').style.display = 'none';
if(jitsiAPI) jitsiAPI.dispose();
}
function playBattleTurn() {
const record = JSON.parse(localStorage.getItem(currentEmail));
const logConsole = document.getElementById('game-log');
if(Math.random() > 0.4) {
record.wins += 1;
logConsole.innerHTML += "
[VITÓRIA] Turno bem-sucedido. Oponente derrotado!";
} else {
record.losses += 1;
logConsole.innerHTML += "
[DERROTA] Falha tática crítica detectada.";
}
localStorage.setItem(currentEmail, JSON.stringify(record));
refreshInterfaceData();
logConsole.scrollTop = logConsole.scrollHeight;
}
function handleMusicToggle() {
const track = document.getElementById('bg-music');
const triggerBtn = document.getElementById('music-trigger');
if(track.paused) {
track.play();
triggerBtn.innerText = "DESLIGAR";
triggerBtn.style.background = "#ff4d4d";
} else {
track.pause();
triggerBtn.innerText = "LIGAR";
triggerBtn.style.background = "#248046";
}
}
function toggleInterfaceTheme() {
document.body.classList.toggle('light-mode');
}
function persistProfileData() {
const record = JSON.parse(localStorage.getItem(currentEmail));
record.profileName = document.getElementById('config-profile-name').value;
record.gameName = document.getElementById('config-game-name').value;
localStorage.setItem(currentEmail, JSON.stringify(record));
alert("Registros internos atualizados com sucesso.");
refreshInterfaceData();
}
function clearUserSession() {
currentEmail = "";
document.getElementById('lock-screen').style.display = 'flex';
document.getElementById('pass-input').value = "";
}
